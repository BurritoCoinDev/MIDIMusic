[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midimusic"
version = "0.1.0"
description = "Local, open-weight AI music generation for Windows. Exports MIDI and FLAC."
readme = "README.md"
# 3.12 is the sweet spot and what the build targets: AMD's Windows ROCm
# wheels are cp312-only, and tinysoundfont publishes no cp313+ wheels.
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "burritocoindev" }]
keywords = ["music", "midi", "flac", "ai", "generative", "suno", "local"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]

# Core stays deliberately small: every one of these has a prebuilt Windows
# wheel with no compiler and no external DLL, so a stock install always works.
dependencies = [
    "PySide6-Essentials>=6.6",
    "numpy>=1.24",
    "soundfile>=0.12",
    "mido>=1.3",
    "pretty_midi>=0.2.10",
    "pyloudnorm>=0.1.1",
    "platformdirs>=4.0",
    # Builds the separate Python environment that neural backends run in. A
    # frozen app cannot install packages with its own interpreter, so this is
    # what lets the installer stay self-contained without bundling torch.
    "uv>=0.5",
    # tinysoundfont declares pyaudio as a hard dependency, but only its live
    # playback helper needs it; offline rendering does not. Windows wheels
    # exist for both, and the app degrades to the built-in numpy synth if
    # either is missing.
    "tinysoundfont>=0.3.7",
    # Playback. The Windows wheels bundle PortAudio, so there is nothing
    # to install separately; on Linux it needs the system library and the
    # app simply runs without playback.
    "sounddevice>=0.4.6",
]

[project.optional-dependencies]
# Neural backends are opt-in; the app provisions these at runtime from the GUI
# so the installer stays small and the right torch variant is chosen per GPU.
torch = ["torch>=2.4", "torchaudio>=2.4"]
transformers = ["transformers>=4.44", "huggingface-hub>=0.24"]
diffusers = ["diffusers>=0.30"]
transcribe = ["basic-pitch>=0.4"]
# Higher-quality resampling. Optional on purpose: soxr statically links
# libsoxr (LGPL-2.1), which would add relinking obligations to a shipped
# binary, and the built-in windowed-sinc path is good enough without it.
resample = ["soxr>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.gui-scripts]
midimusic = "midimusic.__main__:main"

[project.urls]
Homepage = "https://github.com/BurritoCoinDev/MIDIMusic"
Issues = "https://github.com/BurritoCoinDev/MIDIMusic/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
midimusic = ["assets/**/*", "data/**/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # Qt APIs legitimately call functions in defaults
    "SIM105",  # try/except/pass reads better than contextlib.suppress here
    "SIM108",  # ternaries hurt readability in the music-theory branches
    "B027",    # Generator.load/unload are optional hooks, not abstract
    "RUF046",  # int() on an already-int is intentional defensive coercion
    "RUF012",  # dataclass ClassVar noise
    "UP042",   # str+Enum is deliberate: these serialise straight to JSON
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
