name: CI

# Deliberately minimal, to keep Actions usage low.
#
# There is no packaging job here on purpose: building the Windows bundle needs
# a windows-latest runner, which bills at 2x minutes, and the build is not
# something CI needs to prove on every push. Build locally instead:
#
#     cd packaging\windows
#     .\build.ps1
#
# Linux runners bill at 1x, so the suite runs there. It is the same suite: Qt
# runs headless via the offscreen platform, and nothing under test is
# Windows-specific except path handling, which is unit-tested rather than
# needing a Windows runner to observe.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Documentation-only changes should not spend minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Skip runs whose changes cannot affect the result.
    if: >-
      !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Verify the app generates without a display
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import time
          from midimusic.core.models import GenerationRequest, OutputFormat
          from midimusic.core.service import AppService

          svc = AppService()
          jobs = svc.submit(
              GenerationRequest(prompt="ci smoke test, lofi",
                                output_format=OutputFormat.MIDI,
                                duration_seconds=20, seed=1),
              "builtin-composer",
          )
          for _ in range(200):
              if all(j.is_terminal for j in jobs):
                  break
              time.sleep(0.05)
          job = jobs[0]
          assert job.status.value == "done", job.error
          assert job.output_paths, "no file written"
          print("generated", job.output_paths[0].name)
          svc.shutdown()
          PY
