name: CI

# The repository is public, so Actions minutes are free and unmetered. The
# Windows legs are therefore worth running: this is a Windows application, and
# Windows is the only place the packaging can actually be proven.

on:
  push:
    # Feature branches are included while the repository is public and minutes
    # are free, so packaging is exercised before anything reaches main. Trim
    # this back to [main, master] if the repository goes private again --
    # windows-latest bills at 2x, and the build job is the expensive one.
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the shipping target. Linux runs the same suite because it
        # starts faster, so it usually reports a failure first.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        if: runner.os == 'Linux'
        run: ruff check src/ tests/

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Verify the app generates without a display
        env:
          QT_QPA_PLATFORM: offscreen
        shell: python
        run: |
          import time
          from midimusic.core.models import GenerationRequest, OutputFormat
          from midimusic.core.service import AppService

          svc = AppService()
          jobs = svc.submit(
              GenerationRequest(prompt="ci smoke test, lofi",
                                output_format=OutputFormat.MIDI,
                                duration_seconds=20, seed=1),
              "builtin-composer",
          )
          for _ in range(400):
              if all(j.is_terminal for j in jobs):
                  break
              time.sleep(0.05)
          job = jobs[0]
          assert job.status.value == "done", job.error
          assert job.output_paths, "no file written"
          print("generated", job.output_paths[0].name)
          svc.shutdown()

  build:
    name: Build Windows app
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build the bundle
        run: pyinstaller --noconfirm --clean packaging/windows/midimusic.spec

      - name: Verify the bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "dist/MIDIMusic/MIDIMusic.exe")) {
            throw "the executable was not produced"
          }

          # The worker is run by a different interpreter, so it has to survive
          # as a real .py file rather than only as bytecode in the archive.
          if (-not (Test-Path "dist/MIDIMusic/_internal/midimusic/worker/runner.py")) {
            throw "worker script was not bundled"
          }

          # uv builds the compute runtime. Without it the installed app cannot
          # provision anything, because it has no interpreter of its own.
          if (-not (Test-Path "dist/MIDIMusic/_internal/uv/uv.exe")) {
            throw "uv was not bundled - the app would not be self-contained"
          }

          $mb = (Get-ChildItem -Recurse dist/MIDIMusic | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("bundle: {0:N0} MB" -f $mb)
          if ($mb -gt 900) { throw ("bundle is {0:N0} MB - is torch being pulled in?" -f $mb) }

      - name: Check the built app actually starts up
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Run the frozen app's self-test: it builds the QApplication, the
          # service and the main window, then exits with a status code.
          #
          # A liveness check is NOT sufficient here and previously passed a
          # broken build: when a windowed PyInstaller app raises during
          # startup it shows a modal error dialog and KEEPS RUNNING, so
          # "still alive after 25s" reported success while the app was in
          # fact dead on arrival with an ImportError. An exit code cannot be
          # faked that way, and a hang now means the dialog is up.
          $p = Start-Process -FilePath "dist/MIDIMusic/MIDIMusic.exe" `
                             -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(180000)) {
            $p.Kill()
            Get-ChildItem -Recurse "$env:LOCALAPPDATA\MIDIMusic\logs" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
            throw "self-test never exited - the app is almost certainly showing an error dialog"
          }
          if ($p.ExitCode -ne 0) {
            Get-ChildItem -Recurse "$env:LOCALAPPDATA\MIDIMusic\logs" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName -Tail 60 }
            throw "self-test failed with exit code $($p.ExitCode)"
          }
          Write-Host "self-test passed: the packaged app builds its window and exits cleanly"

      - name: Check the GUI stays up
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Now that startup is proven, confirm the real windowed path keeps
          # running rather than exiting immediately.
          $p = Start-Process -FilePath "dist/MIDIMusic/MIDIMusic.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "the app exited on startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "app started and stayed running"

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (Test-Path $iscc) {
            & $iscc "packaging\windows\installer.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
          } else {
            Write-Host "Inno Setup not on this runner; skipping the installer"
          }

      - name: Upload the app
        uses: actions/upload-artifact@v6
        with:
          name: MIDIMusic-windows
          path: dist/MIDIMusic/
          retention-days: 30

      - name: Upload the installer
        uses: actions/upload-artifact@v6
        if: hashFiles('packaging/windows/Output/*.exe') != ''
        with:
          name: MIDIMusic-installer
          path: packaging/windows/Output/*.exe
          retention-days: 30
