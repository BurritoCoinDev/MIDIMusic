name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the shipping target; Linux runs the same suite because it
        # is faster and catches most regressions first.
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.11"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 \
            libxcb-xkb1 libxkbcommon-x11-0

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --cov=midimusic --cov-report=term-missing

      - name: Verify the app starts and generates without a display
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "
          import sys
          from midimusic.core.service import AppService
          from midimusic.core.models import GenerationRequest, OutputFormat
          import time
          svc = AppService()
          jobs = svc.submit(GenerationRequest(prompt='ci smoke test, lofi',
                                              output_format=OutputFormat.MIDI,
                                              duration_seconds=20, seed=1),
                            'builtin-composer')
          for _ in range(200):
              if all(j.is_terminal for j in jobs): break
              time.sleep(0.05)
          job = jobs[0]
          assert job.status.value == 'done', job.error
          assert job.output_paths, 'no file written'
          print('generated', job.output_paths[0].name)
          svc.shutdown()
          "

  build-windows:
    name: Build Windows bundle
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/windows/midimusic.spec

      - name: Check the bundle is sane
        shell: pwsh
        run: |
          $exe = "dist/MIDIMusic/MIDIMusic.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          # The worker has to survive as a real file: it is run by a different
          # interpreter, so bytecode inside the archive would not do.
          if (-not (Test-Path "dist/MIDIMusic/_internal/midimusic/worker/runner.py")) {
            throw "worker script was not bundled"
          }
          $mb = (Get-ChildItem -Recurse dist/MIDIMusic | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("bundle: {0:N0} MB" -f $mb)
          if ($mb -gt 900) { throw "bundle unexpectedly large - is torch being pulled in?" }

      - uses: actions/upload-artifact@v4
        with:
          name: MIDIMusic-windows
          path: dist/MIDIMusic/
          retention-days: 14
